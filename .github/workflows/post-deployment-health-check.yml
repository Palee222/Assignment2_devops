name: Post-deployment health checks

on:
  workflow_call:
    inputs:
      password_service_url:
        description: HTTPS base URL for the password service
        required: true
        type: string
      incidents_service_url:
        description: HTTPS base URL for the incidents service
        required: true
        type: string
      timeout_seconds:
        description: Maximum time to wait for each service to return HTTP 200
        required: false
        type: number
        default: 300
      retry_interval_seconds:
        description: Delay between health-check attempts
        required: false
        type: number
        default: 10

jobs:
  health-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check both service health endpoints
        shell: bash
        env:
          PASSWORD_SERVICE_URL: ${{ inputs.password_service_url }}
          INCIDENTS_SERVICE_URL: ${{ inputs.incidents_service_url }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          RETRY_INTERVAL_SECONDS: ${{ inputs.retry_interval_seconds }}
        run: |
          set -euo pipefail

          if ! [[ "$TIMEOUT_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::timeout_seconds must be a positive integer."
            exit 1
          fi
          if ! [[ "$RETRY_INTERVAL_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::retry_interval_seconds must be a positive integer."
            exit 1
          fi

          check_health() {
            local service_name="$1"
            local base_url="$2"
            local health_url="${base_url%/}/health"
            local deadline=$((SECONDS + TIMEOUT_SECONDS))

            while (( SECONDS < deadline )); do
              local remaining=$((deadline - SECONDS))
              local request_timeout=10
              if (( remaining < request_timeout )); then
                request_timeout="$remaining"
              fi

              local status
              if status="$(curl --proto '=https' --silent --show-error \
                --output /dev/null --write-out '%{http_code}' \
                --max-time "$request_timeout" "$health_url")"; then
                if [[ "$status" == "200" ]]; then
                  echo "$service_name health check passed."
                  return 0
                fi
              else
                status="000"
              fi

              echo "$service_name health check returned HTTP $status; retrying."
              remaining=$((deadline - SECONDS))
              if (( remaining <= 0 )); then
                break
              fi
              local sleep_seconds="$RETRY_INTERVAL_SECONDS"
              if (( remaining < sleep_seconds )); then
                sleep_seconds="$remaining"
              fi
              sleep "$sleep_seconds"
            done

            echo "::error::$service_name did not return HTTP 200 within ${TIMEOUT_SECONDS}s."
            return 1
          }

          failed=0
          check_health "Password service" "$PASSWORD_SERVICE_URL" || failed=1
          check_health "Incidents service" "$INCIDENTS_SERVICE_URL" || failed=1
          exit "$failed"
