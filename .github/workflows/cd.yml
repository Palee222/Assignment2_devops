name: CD
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      password_url: ${{ steps.urls.outputs.password }}
      incidents_url: ${{ steps.urls.outputs.incidents }}
    env:
      PREFIX: ${{ vars.PREFIX }}
      RG: ${{ vars.RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point Container Apps at this commit's images
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          az containerapp update -n $PREFIX-password  -g $RG --image $IMG-password-service:$GITHUB_SHA
          az containerapp update -n $PREFIX-incidents -g $RG --image $IMG-incidents-service:$GITHUB_SHA

      - name: Get service URLs
        id: urls
        run: |
          for s in password incidents; do
            fqdn=$(az containerapp show -n $PREFIX-$s -g $RG --query properties.configuration.ingress.fqdn -o tsv)
            echo "$s=https://$fqdn" >> "$GITHUB_OUTPUT"
          done

      - uses: oven-sh/setup-bun@v2
      - name: Build UI with the service URLs
        working-directory: Dev2/ui
        env:
          VITE_PASSWORD_API_URL: ${{ steps.urls.outputs.password }}
          VITE_INCIDENTS_API_URL: ${{ steps.urls.outputs.incidents }}
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Upload UI to the static website
        run: |
          az storage blob upload-batch --account-name ${{ vars.UI_STORAGE }} --auth-mode key \
            -d '$web' -s Dev2/ui/.output/public --overwrite

  health:
    needs: deploy
    uses: ./.github/workflows/post-deployment-health-check.yml
    with:
      password_service_url: ${{ needs.deploy.outputs.password_url }}
      incidents_service_url: ${{ needs.deploy.outputs.incidents_url }}
      timeout_seconds: 300