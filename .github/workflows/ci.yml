name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dev2
    env:
      PYTHONPATH: .:src
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate system.yaml against its JSON Schema
        run: python -m pytest tests/test_system_contract.py -q
      - name: Lint OpenAPI specifications
        run: >-
          npx --yes @redocly/cli@2.83.0 lint
          services/service1/openapi.yaml
          services/service2/openapi.yaml
      - run: >-
          python -m pytest
          services/service1/tests
          --cov=services.service1
          --cov-fail-under=70
          --cov-report=term-missing
          --cov-report=xml:coverage-service1.xml
      - run: >-
          python -m pytest
          services/service2/tests
          tests/test_cross_service.py
          --cov=services.service2
          --cov-fail-under=70
          --cov-report=term-missing
          --cov-report=xml:coverage-service2.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: Dev2/coverage-service*.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Dev2/ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx eslint src/lib/security.ts src/lib/use-password-checker.ts src/routes/password.tsx
      - run: bun run build

  container-images:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image prefix
        id: image
        shell: bash
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push password service
        uses: docker/build-push-action@v6
        with:
          context: ./Dev2/services/service1
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.prefix }}-password-service:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
      - name: Build and push incidents service
        uses: docker/build-push-action@v6
        with:
          context: ./Dev2/services/service2
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.image.outputs.prefix }}-incidents-service:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call: