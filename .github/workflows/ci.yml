name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .:src
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: >-
          python -m pytest
          services/service1/tests
          --cov=services.service1
          --cov-fail-under=70
          --cov-report=term-missing
          --cov-report=xml:coverage-service1.xml
      - run: >-
          python -m pytest
          services/service2/tests
          tests/test_cross_service.py
          --cov=services.service2
          --cov-fail-under=70
          --cov-report=term-missing
          --cov-report=xml:coverage-service2.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage-service*.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx eslint src/lib/security.ts src/lib/use-password-checker.ts src/routes/password.tsx
      - run: bun run build
