# yaml-language-server: $schema=./system.schema.json
name: secnote
ui:
  path: ui
  calls:
    - password
    - incidents
services:
  password:
    description: Scores passwords and optionally reports weak findings as incidents.
    path: services/service1
    openapi: services/service1/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/service1/migrations
    env:
      PORT:
        default: 8000
        description: Port the service listens on.
      DATABASE_URL:
        secret: true
        description: Connection string for the Password service database.
      INCIDENTS_SERVICE_URL:
        default: http://incidents-service:8000
        description: Base URL of the Incidents service.
      INCIDENTS_TIMEOUT_S:
        default: 2
        description: Maximum time to wait for incident creation.
      GIT_SHA:
        default: unknown
        description: Git commit SHA embedded in the running service's health response.
      CORS_ALLOWED_ORIGINS:
        default: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
        description: Comma-separated exact browser origins allowed to call the API.
    calls:
      service: incidents
      url_env: INCIDENTS_SERVICE_URL
      endpoints:
        - POST /incidents
      timeout_s: 2
      on_failure: Return the password score and mark incident_report unavailable.
  incidents:
    description: Creates, lists, and updates security incidents and tags.
    path: services/service2
    openapi: services/service2/openapi.yaml
    port_default: 8000
    health: /health
    migrations: services/service2/migrations
    env:
      PORT:
        default: 8000
        description: Port the service listens on.
      DATABASE_URL:
        secret: true
        description: Connection string for the Incidents service database.
      GIT_SHA:
        default: unknown
        description: Git commit SHA embedded in the running service's health response.
      CORS_ALLOWED_ORIGINS:
        default: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
        description: Comma-separated exact browser origins allowed to call the API.
azure:
  deployment: not-configured
  note: Configure deployment targets and resource identifiers for the Azure environment.
